# 🚀 Auto-Update Featured Projects (Public Repositories Only)
# Automatically syncs the Featured Projects section in README.md with public repositories
# Strictly excludes all private, forked, archived, or profile repositories

name: Update Featured Projects

on:
  # Runs automatically every 6 hours
  schedule:
    - cron: "0 */6 * * *"

  # Runs when workflow is updated
  push:
    branches:
      - main
    paths:
      - ".github/workflows/featured-projects.yml"

  # Allows manual trigger from the Actions tab
  workflow_dispatch:

jobs:
  update-projects:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch Public Repos & Update README.md
        env:
          USERNAME: MenBoyBMN
        run: |
          python3 - << 'EOF'
          import json
          import os
          import re
          import urllib.request

          username = os.environ.get("USERNAME", "MenBoyBMN")
          url = f"https://api.github.com/users/{username}/repos?type=owner&sort=pushed&per_page=100"

          req = urllib.request.Request(
              url,
              headers={
                  "Accept": "application/vnd.github+json",
                  "User-Agent": f"{username}-Profile-Updater"
              }
          )
          with urllib.request.urlopen(req, timeout=20) as resp:
              repos = json.loads(resp.read().decode("utf-8"))

          # Strictly filter ONLY public, non-fork, non-archived repositories
          public_repos = []
          for r in repos:
              if r.get("private") is not False:
                  continue
              if r.get("visibility") != "public":
                  continue
              if r.get("fork") or r.get("archived"):
                  continue
              name = r.get("name", "")
              if not name or name.lower() == username.lower():
                  continue
              # Skip coursework repositories containing 8+ digit student IDs
              if re.search(r"\d{8,}", name):
                  continue
              public_repos.append(r)

          # Sort: repositories with descriptions first, then most recently pushed
          public_repos.sort(
              key=lambda r: (
                  1 if (r.get("description") or "").strip() else 0,
                  r.get("pushed_at") or ""
              ),
              reverse=True
          )

          selected = public_repos[:6]

          cards = []
          for idx, r in enumerate(selected):
              repo_name = r["name"]
              card = (
                  f'  <a href="https://github.com/{username}/{repo_name}">'
                  f'<img src="https://github-readme-stats.shion.dev/api/pin/?username={username}&repo={repo_name}'
                  f'&theme=radical&hide_border=false&border_color=6C63FF&border_radius=10'
                  f'&bg_color=0D1117&title_color=6C63FF&icon_color=A9FBD7&text_color=C9D1D9" alt="{repo_name}"/></a>'
              )
              cards.append(card)

          rows = []
          for i in range(0, len(cards), 2):
              rows.append("\n".join(cards[i:i+2]))

          new_block = (
              "<!-- FEATURED-PROJECTS:START -->\n"
              '<div align="center">\n'
              + "\n  <br/>\n".join(rows)
              + "\n</div>\n"
              "<!-- FEATURED-PROJECTS:END -->"
          )

          with open("README.md", "r", encoding="utf-8") as f:
              content = f.read()

          pattern = r"<!-- FEATURED-PROJECTS:START -->.*?<!-- FEATURED-PROJECTS:END -->"
          updated = re.sub(pattern, new_block, content, flags=re.DOTALL)

          if updated != content:
              with open("README.md", "w", encoding="utf-8") as f:
                  f.write(updated)
              print(f"Updated Featured Projects with {len(selected)} public repos.")
          else:
              print("No changes to Featured Projects.")
          EOF

      - name: Commit & Push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --staged --quiet || (git commit -m "🚀 Auto-update public Featured Projects" && git push)
